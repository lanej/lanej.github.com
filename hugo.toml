baseURL = 'https://lanej.io/'
locale = 'en-US'
title = 'Josh Lane'
disableKinds = ['taxonomy', 'term']
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
[params]
  description = 'Essays by Josh Lane on software, AI, engineering judgment, and organizations. Engineer and technology leader with experience at Engine Yard, Fastly, and EasyPost.'
  role = 'Chief Technology Officer at EasyPost'
  linkedin = 'https://www.linkedin.com/in/lanejoshlane/'
  github = 'https://github.com/lanej'
  revision = 'local'
[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'RSS']
[pagination]
  pagerSize = 10
[markup.goldmark.renderer]
  unsafe = false
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false
[markup.highlight]
  style = 'evergarden'
  guessSyntax = false
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3
[caches.images]
  dir = ':cacheDir/images'
