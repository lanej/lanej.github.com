{{ $id := printf "decision-carry-forward-%d" .Ordinal }}
<figure class="sc-figure diagram-restyled" data-essay-diagram="decision-carry-forward" aria-labelledby="{{ $id }}-title {{ $id }}-caption">
<h3 class="sc-figure-title" id="{{ $id }}-title">What carries forward</h3>
<div class="carry-forward">
<div class="carry-endpoint">
  {{ partial "diagrams/atoms/node.html" (dict "label" "A decision" "role" "decision" "showRoleMarker" true) }}
</div>
<div class="sc-flow-connector" aria-hidden="true"></div>
<div class="carry-paths" role="group" aria-label="Two parallel consequences of the same decision">
<div class="carry-path diagram-delivery"><span class="carry-direction">Outward</span><strong class="sc-node-label">Relationships</strong><p>What others learn from our conduct</p><p class="carry-result">The trust they bring next time</p></div>
<div class="carry-path diagram-skill"><span class="carry-direction">Inward</span><strong class="sc-node-label">Character</strong><p>What we practice through our choices</p><p class="carry-result">The habits we bring next time</p></div>
</div>
<div class="sc-flow-connector" aria-hidden="true"></div>
<div class="carry-endpoint">
  {{ partial "diagrams/atoms/node.html" (dict "label" "The next decision" "role" "decision" "showRoleMarker" true) }}
</div>
</div>
<figcaption class="sc-caption" id="{{ $id }}-caption">We carry forward both the trust we leave with others and the habits we build in ourselves.</figcaption>
</figure>
