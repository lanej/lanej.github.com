<figure class="essay-diagram" data-essay-diagram="harmony-review" aria-labelledby="harmony-review-caption">
  <div class="formalization-panel">
    <p class="diagram-label">Preserve coherence through change</p>
    <p class="diagram-description">After each pass, revisit the relationships—not only the edited text.</p>
    <ol class="formalization-steps">
      <li><div class="flow-node"><strong>Change</strong><span>A requirement, constraint, or policy moves.</span></div><p>Identify what is different.</p></li>
      <li><div class="flow-node"><strong>Trace</strong><span>Which earlier conclusions depended on it?</span></div><p>Untouched does not mean unaffected.</p></li>
      <li><div class="flow-node"><strong>Reconcile</strong><span>Preserve the promise—or explicitly revise it.</span></div><p>Reopen decisions when needed.</p></li>
      <li><div class="flow-node flow-node-accent"><strong>Verify and record</strong><span>Check the relationship. Name the uncertainty.</span></div><p>A recorded review is not a proof.</p></li>
    </ol>
  </div>
  <figcaption id="harmony-review-caption"><span>Figure 2.</span> Review follows the consequences of a change, not just the files in its diff.</figcaption>
</figure>
