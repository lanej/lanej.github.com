<figure class="essay-diagram studio-system" data-essay-diagram="studio-system" aria-labelledby="studio-system-caption">
  <div class="studio-system-intro">
    <p class="diagram-label">The working loop</p>
    <p class="diagram-description">Three accountable stages. Two supporting tools. One return path.</p>
  </div>
  <ol class="studio-system-stages">
    <li class="studio-system-stage">
      <div class="studio-system-core">
        <span class="studio-system-number">01</span>
        <div>
          <span class="studio-system-kicker">Decide &amp; approve</span>
          <strong>Studio</strong>
          <p>Conversation, specification, task graph, human decisions</p>
        </div>
      </div>
      <div class="studio-system-companion">
        <span class="studio-system-companion-line" aria-hidden="true"></span>
        <div>
          <span class="studio-system-kicker">Editor connection</span>
          <strong>Copydesk</strong>
          <p>Neovim documents and selected feedback</p>
        </div>
      </div>
      <div class="studio-system-handoff"><span aria-hidden="true">↓</span> Approved work</div>
    </li>
    <li class="studio-system-stage">
      <div class="studio-system-core">
        <span class="studio-system-number">02</span>
        <div>
          <span class="studio-system-kicker">Run &amp; verify</span>
          <strong>Producer</strong>
          <p>Agent attempts, verification, review evidence, recovery</p>
        </div>
      </div>
      <div class="studio-system-companion">
        <span class="studio-system-companion-line" aria-hidden="true"></span>
        <div>
          <span class="studio-system-kicker">Workspace connection</span>
          <strong>Stagehand</strong>
          <p>Isolated worktrees and safe cleanup</p>
        </div>
      </div>
      <div class="studio-system-handoff"><span aria-hidden="true">↓</span> Accepted change</div>
    </li>
    <li class="studio-system-stage">
      <div class="studio-system-core">
        <span class="studio-system-number">03</span>
        <div>
          <span class="studio-system-kicker">Publish &amp; follow up</span>
          <strong>Publisher</strong>
          <p>PRs, checks, reviews, guarded GitHub operations</p>
        </div>
      </div>
      <div class="studio-system-companion">
        <span class="studio-system-companion-line" aria-hidden="true"></span>
        <div>
          <span class="studio-system-kicker">External record</span>
          <strong>GitHub</strong>
          <p>Code review and publication state</p>
        </div>
      </div>
    </li>
  </ol>
  <div class="studio-system-return">
    <span class="studio-system-return-arrow" aria-hidden="true">↶</span>
    <p><strong>Back to Studio</strong><span>Review feedback and results return to the owning conversation.</span></p>
  </div>
  <figcaption id="studio-system-caption"><span>Figure 1.</span> Connections support a shared workflow without giving every tool the same authority.</figcaption>
</figure>
