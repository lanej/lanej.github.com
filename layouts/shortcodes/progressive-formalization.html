<div class="formalization-panel">
<p class="diagram-label">Progressive formalization</p><p class="diagram-description">As uncertainty falls, move behavior from language into software.</p>
<ol class="formalization-steps">
<li><span class="flow-node"><strong>Prompt</strong><span>Discover behavior</span></span><p>Flexible. Good for exploration.</p></li>
<li><span class="flow-node"><strong>Repeated correction</strong><span>Identify patterns</span></span><p>The same feedback, again and again.</p></li>
<li><span class="flow-node"><strong>Skill</strong><span>Encode procedure</span></span><p>Reusable, with judgment.</p></li>
<li><span class="flow-node flow-node-accent"><strong>Program / hook</strong><span>Enforce the check</span></span><p>Fast, consistent, mechanical.</p></li>
</ol>
</div>
<figcaption id="formalization-caption"><span>Figure 2.</span> Every repeated correction is a candidate for compilation—not an instruction to automate every judgment.</figcaption>
