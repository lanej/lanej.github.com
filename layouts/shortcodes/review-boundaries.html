{{ $id := printf "review-boundaries-%d" .Ordinal }}
<figure class="sc-figure" data-essay-diagram="review-boundaries" aria-labelledby="{{ $id }}-title {{ $id }}-caption">
<p class="sc-figure-title" id="{{ $id }}-title">One capability, explicit boundaries</p>
<div class="sc-node carry-endpoint"><span><strong class="sc-node-label">Composition</strong><span class="sc-node-detail">Construct the collaborators</span></span></div>
<div class="sc-flow-connector" aria-hidden="true"></div>
<div class="sc-node"><span><strong class="sc-node-label">Review workflow</strong><span class="sc-node-detail">Decide, reserve, publish, reconcile</span></span></div>
<div class="sc-flow-connector" aria-hidden="true"></div>
<div class="carry-paths" role="group" aria-label="The workflow calls pure policy and effectful integrations">
<div class="carry-path"><span class="carry-direction">Decision</span><strong class="sc-node-label">Pure policy</strong><p>Owned values in; a decision and reason out.</p><p class="carry-result">No SDK, database, clock, or hidden I/O.</p></div>
<div class="carry-path"><span class="carry-direction">Effects</span><strong class="sc-node-label">Concrete integrations</strong><p>SQLite journal and an Octokit adapter.</p><p class="carry-result">Reserve before writing. Read evidence to reconcile.</p></div>
</div>
<figcaption class="sc-caption" id="{{ $id }}-caption">Runtime calls flow downward. The policy never calls back into integrations. The GitHub adapter implements the small contract owned by its consuming workflow.</figcaption>
</figure>
