<figure class="essay-diagram" data-essay-diagram="minimum-dose-decision" aria-labelledby="minimum-dose-decision-caption">
<div class="formalization-panel">
<p class="diagram-label">Earn the next commitment</p>
<p class="diagram-description">Each intervention should change what we are justified in doing next.</p>
<ol class="formalization-steps">
<li><span class="flow-node"><strong>Question</strong><span>What blocks the decision?</span></span><p>Name the uncertainty and the outcome that matters.</p></li>
<li><span class="flow-node"><strong>Test</strong><span>What would resolve it?</span></span><p>Choose the smallest credible test, including necessary safeguards.</p></li>
<li><span class="flow-node"><strong>Evidence</strong><span>What actually happened?</span></span><p>Account for the result, limitations, and all the work involved.</p></li>
<li><span class="flow-node flow-node-accent"><strong>Commitment</strong><span>What does this justify?</span></span><p>Continue, change, or stop. Expansion is not automatic.</p></li>
</ol>
</div>
<figcaption id="minimum-dose-decision-caption"><span>Figure 2.</span> The next intervention starts from the evidence, not the unbuilt portion of the original plan.</figcaption>
</figure>
