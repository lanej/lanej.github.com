<figure class="essay-diagram" data-essay-diagram="feedback-loop" aria-labelledby="feedback-loop-caption">
<div class="loop-comparison">
<section class="diagram-panel" aria-label="Open loop">
<p class="diagram-label">Open loop</p><p class="diagram-description">Plausible, but unverified.</p>
<div class="flow-row">
  {{ partial "diagrams/atoms/node.html" (dict "label" "Intent") }}
  {{ partial "diagrams/atoms/arrow.html" "right" }}
  {{ partial "diagrams/atoms/node.html" (dict "label" "AI") }}
  {{ partial "diagrams/atoms/arrow.html" "right" }}
  {{ partial "diagrams/atoms/node.html" (dict "label" "Output" "role" "caution") }}
</div>
<p class="open-loop-note diagram-caution">No return path from reality.</p>
</section>
<section class="diagram-panel closed-loop" aria-label="Closed loop">
<p class="diagram-label">Closed loop</p><p class="diagram-description">Action informed by evidence.</p>
<p class="loop-intent">Intent <span aria-hidden="true">↓</span></p>
<div class="flow-row">
  {{ partial "diagrams/atoms/node.html" (dict "label" "AI" "role" "accent") }}
  {{ partial "diagrams/atoms/arrow.html" "right" }}
  {{ partial "diagrams/atoms/node.html" (dict "label" "Action") }}
  {{ partial "diagrams/atoms/arrow.html" "right" }}
  {{ partial "diagrams/atoms/node.html" (dict "label" "Environment") }}
</div>
<div class="feedback-return diagram-evidence"><span class="return-arrow" aria-hidden="true">↑</span><span class="feedback-label">Evidence <span aria-hidden="true">←</span> Verification</span><span class="return-arrow" aria-hidden="true">↓</span></div>
<p class="loop-note">Observe the result. Adjust the next action.</p>
</section>
</div>
<figcaption id="feedback-loop-caption"><span>Figure 1.</span> The difference is not a better prompt. It is a return path from reality.</figcaption>
</figure>
