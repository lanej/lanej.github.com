{{ define "main" }}
<section class="page shell"><header class="page-header"><h1>{{ .Title }}</h1></header><div class="prose">{{ .Content }}</div>{{ range .RegularPages.ByDate.Reverse }}<article class="writing-item"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2><p>{{ .Description }}</p></article>{{ end }}</section>
{{ end }}
