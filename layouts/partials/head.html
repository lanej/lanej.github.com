<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{ $description := .Description | default site.Params.description }}
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ $description }}">
<meta name="theme-color" content="#0b1210">
<link rel="canonical" href="{{ .Permalink }}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/headshot.css">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}">
<meta property="og:description" content="{{ $description }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ site.Params.socialImage }}">
<meta name="twitter:card" content="summary_large_image">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"Josh Lane","url":"https://lanej.io/","image":"{{ site.Params.socialImage }}","jobTitle":"Chief Technology Officer","worksFor":{"@type":"Organization","name":"EasyPost","url":"https://www.easypost.com/"},"sameAs":["https://github.com/lanej"]}</script>
