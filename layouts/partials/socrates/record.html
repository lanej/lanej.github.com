<h3 class="sc-figure-title" id="record-title">What the handoff preserves</h3>
<div class="sc-cycle-node" data-node><strong>Decision to preserve</strong><span class="sc-node-detail">Require human approval within the guarded workflow. Other access remains outside its control.</span></div>
<div class="sc-flow-connector" aria-hidden="true"></div>
<div class="sc-record-branches">
<div class="sc-cycle-node" data-node><strong>Executor may choose</strong><span class="sc-node-detail">Prompt wording and internal code structure.</span></div>
<div class="sc-cycle-node" data-node><strong>Executor must preserve</strong><span class="sc-node-detail">Denial or timeout stops the operation. Automated confirmation is not approval.</span></div>
</div>
<div class="sc-flow-connector" aria-hidden="true"></div>
<div class="sc-cycle-node" data-node><strong>Evidence for acceptance</strong><span class="sc-node-detail">Exercise missing approval and automated confirmation; inspect whether the costly operation ran.</span></div>
<figcaption class="sc-caption">The decision record carries the why, the limits, and the proof obligation into the next session.</figcaption>
