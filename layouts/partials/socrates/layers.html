<figure aria-labelledby="layers-title" class="sc-figure sc-layers-figure" data-essay-diagram="socrates-layers" id="layers-figure">
<h3 class="sc-figure-title" id="layers-title">The seven layers, applied to the cost gate</h3>
<ol class="sc-layers">
<li class="sc-layer-row" style="--level:0"><div class="sc-layer-name flow-node" data-node><span class="sc-layer-number">1</span><strong>Problem</strong></div><span class="sc-layer-description">spending beyond the intended budget without a deliberate human decision</span></li>
<li class="sc-layer-row" style="--level:1"><div class="sc-layer-name flow-node" data-node><span class="sc-layer-number">2</span><strong>Requirements</strong></div><span class="sc-layer-description">require human approval when the guarded workflow reaches its limit</span></li>
<li class="sc-layer-row" style="--level:2"><div class="sc-layer-name flow-node" data-node><span class="sc-layer-number">3</span><strong>Constraints</strong></div><span class="sc-layer-description">the agent keeps its existing shell access</span></li>
<li class="sc-layer-row" style="--level:3"><div class="sc-layer-name flow-node" data-node><span class="sc-layer-number">4</span><strong>Risks</strong></div><span class="sc-layer-description">trust in the gate extends beyond the workflow it controls</span></li>
<li class="sc-layer-row" style="--level:4"><div class="sc-layer-name flow-node" data-node><span class="sc-layer-number">5</span><strong>Success</strong></div><span class="sc-layer-description">the guarded operation stops when approval is denied or absent</span></li>
<li class="sc-layer-row" style="--level:5"><div class="sc-layer-name flow-node" data-node><span class="sc-layer-number">6</span><strong>Validation</strong></div><span class="sc-layer-description">exercise refusal and timeout; verify that no costly operation runs</span></li>
<li class="sc-layer-row" style="--level:6"><div class="sc-layer-name flow-node" data-node><span class="sc-layer-number">7</span><strong>Execution readiness</strong></div><span class="sc-layer-description">approval rules, dependencies, and checks are settled</span></li>
</ol><figcaption class="sc-caption">Each layer changes what the next one must prove. A weakness higher in the stack should send us back down, not get papered over in the plan.</figcaption>
</figure>
