<figure aria-labelledby="layers-title" class="sc-figure sc-layers-figure" data-essay-diagram="socrates-layers" id="layers-figure">
<h3 class="sc-figure-title" id="layers-title">The seven layers, applied to the cost gate</h3>
<ol class="sc-layers">
<li class="sc-layer-row" style="--level:0"><div class="sc-layer-name flow-node" data-node><span class="sc-layer-number">1</span><strong>Problem</strong></div><span class="sc-layer-description">a safety feature is described as removing agent self-approval, but the agent retains a way around it entirely</span></li>
<li class="sc-layer-row" style="--level:1"><div class="sc-layer-name flow-node" data-node><span class="sc-layer-number">2</span><strong>Requirements</strong></div><span class="sc-layer-description">state plainly what’s being built: friction against a shortcut, not containment</span></li>
<li class="sc-layer-row" style="--level:2"><div class="sc-layer-name flow-node" data-node><span class="sc-layer-number">3</span><strong>Constraints</strong></div><span class="sc-layer-description">the agent keeps its existing shell access</span></li>
<li class="sc-layer-row" style="--level:3"><div class="sc-layer-name flow-node" data-node><span class="sc-layer-number">4</span><strong>Risks</strong></div><span class="sc-layer-description">a control earns more trust than it deserves, because its name overclaims</span></li>
<li class="sc-layer-row" style="--level:4"><div class="sc-layer-name flow-node" data-node><span class="sc-layer-number">5</span><strong>Success</strong></div><span class="sc-layer-description">fail-closed on denial or timeout, no retry-with-parameter escape hatch, same limits across entry points</span></li>
<li class="sc-layer-row" style="--level:5"><div class="sc-layer-name flow-node" data-node><span class="sc-layer-number">6</span><strong>Validation</strong></div><span class="sc-layer-description">force a timeout, force a denial, confirm the old bypass flag is inert</span></li>
<li class="sc-layer-row" style="--level:6"><div class="sc-layer-name flow-node" data-node><span class="sc-layer-number">7</span><strong>Execution readiness</strong></div><span class="sc-layer-description">native biometric integration, documented timeout and cap configuration</span></li>
</ol><figcaption class="sc-caption">Each layer changes what the next one must prove. A weakness higher in the stack should send us back down, not get papered over in the plan.</figcaption>
</figure>
