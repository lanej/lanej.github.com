<figure aria-labelledby="workflow-title" class="sc-figure sc-workflow-figure" data-essay-diagram="socrates-workflow" id="workflow-figure">
<h3 class="sc-figure-title" id="workflow-title">The workflow</h3>
<div class="sc-workflow">
<div class="sc-workflow-stage"><div class="sc-step flow-node" data-node><span class="sc-step-number">1</span><strong>Interrogate</strong></div><p class="sc-step-detail">Explore the problem</p></div>
<div aria-hidden="true" class="sc-workflow-connector"></div>
<div class="sc-workflow-stage"><div class="sc-step flow-node" data-node><span class="sc-step-number">2</span><strong>Validate</strong></div><p class="sc-step-detail">Build the specification</p></div>
<div aria-hidden="true" class="sc-workflow-connector"></div>
<div class="sc-workflow-stage"><div class="sc-step flow-node" data-node><span class="sc-step-number">3</span><strong>Plan</strong></div><p class="sc-step-detail">Create and review the plan</p></div>
<div aria-hidden="true" class="sc-workflow-connector"></div>
<div class="sc-workflow-stage"><div class="sc-step flow-node" data-node><span class="sc-step-number">4</span><strong>Execute</strong></div><p class="sc-step-detail">Do the work</p></div>
<div aria-hidden="true" class="sc-workflow-connector"></div>
<div class="sc-workflow-stage"><div class="sc-step flow-node" data-node><span class="sc-step-number">5</span><strong>Verify</strong></div><p class="sc-step-detail">Check the result</p></div>
</div>
<div aria-hidden="true" class="sc-return-path"><span class="sc-return-label">Reopen if needed</span></div>
<figcaption class="sc-caption">New evidence can reopen the specification. The difference is that the change to the agreement is explicit.</figcaption>
</figure>
