<figure aria-labelledby="workflow-title" class="sc-figure sc-workflow-figure" data-essay-diagram="socrates-workflow" id="workflow-figure">
<h3 class="sc-figure-title" id="workflow-title">The decision handoff</h3>
<div class="sc-workflow">
<div class="sc-workflow-stage"><div class="sc-step flow-node" data-node><span class="sc-step-number">1</span><strong>Interrogate</strong></div><p class="sc-step-detail">Research + dialogue</p></div>
<div aria-hidden="true" class="sc-workflow-connector"></div>
<div class="sc-workflow-stage"><div class="sc-step flow-node" data-node><span class="sc-step-number">2</span><strong>Freeze spec</strong></div><p class="sc-step-detail">spec.md + authority boundaries</p></div>
<div aria-hidden="true" class="sc-workflow-connector"></div>
<div class="sc-workflow-stage"><div class="sc-step flow-node" data-node><span class="sc-step-number">3</span><strong>Critique plan</strong></div><p class="sc-step-detail">plan.md + independent review</p></div>
<div aria-hidden="true" class="sc-workflow-connector"></div>
<div class="sc-workflow-stage"><div class="sc-step flow-node" data-node><span class="sc-step-number">4</span><strong>Execute</strong></div><p class="sc-step-detail">implement the agreed change</p></div>
<div aria-hidden="true" class="sc-workflow-connector"></div>
<div class="sc-workflow-stage"><div class="sc-step flow-node" data-node><span class="sc-step-number">5</span><strong>Verify</strong></div><p class="sc-step-detail">dogfood the failure paths</p></div>
</div>
<div aria-hidden="true" class="sc-return-path"><span class="sc-return-label">New evidence reopens the specification</span></div>
<figcaption class="sc-caption">Reasoning and execution are different sequences. The documents preserve the decisions while the plan orders the work.</figcaption>
</figure>
