<figure aria-labelledby="method-title" class="sc-figure sc-method-figure" data-essay-diagram="socrates-method" id="method-figure">
<h3 class="sc-figure-title" id="method-title">The Socratic method</h3>
<div aria-label="Question assumptions, examine reasoning, test tensions, and revise understanding. Repeat as new evidence emerges." class="sc-method-loop" role="group">
<div class="sc-cycle-node sc-question flow-node" data-node><span class="sc-node-label">Question assumptions</span><span class="sc-node-detail">What are we treating as already decided?</span></div>
<div aria-hidden="true" class="sc-cycle-connector sc-turn-one"><svg preserveAspectRatio="none" viewBox="0 0 100 100"><path d="M6 50 C50 50 50 50 50 92"></path><path class="sc-arrowhead" d="m46 86 4 6 4-6"></path></svg><span class="sc-vertical-arrow"></span></div>
<div class="sc-cycle-node sc-examine flow-node" data-node><span class="sc-node-label">Examine reasoning</span><span class="sc-node-detail">Why does that conclusion follow?</span></div>
<div aria-hidden="true" class="sc-cycle-connector sc-turn-two"><svg preserveAspectRatio="none" viewBox="0 0 100 100"><path d="M50 6 C50 50 50 50 8 50"></path><path class="sc-arrowhead" d="m14 46-6 4 6 4"></path></svg><span class="sc-vertical-arrow"></span></div>
<div class="sc-cycle-node sc-test flow-node" data-node><span class="sc-node-label">Test tensions</span><span class="sc-node-detail">Which beliefs or constraints conflict?</span></div>
<div aria-hidden="true" class="sc-cycle-connector sc-turn-three"><svg preserveAspectRatio="none" viewBox="0 0 100 100"><path d="M94 50 C50 50 50 50 50 8"></path><path class="sc-arrowhead" d="m46 14 4-6 4 6"></path></svg><span class="sc-vertical-arrow"></span></div>
<div class="sc-cycle-node sc-revise flow-node" data-node><span class="sc-node-label">Revise understanding</span><span class="sc-node-detail">What is the clearer problem now?</span></div>
<div aria-hidden="true" class="sc-cycle-connector sc-turn-four"><svg preserveAspectRatio="none" viewBox="0 0 100 100"><path d="M50 94 C50 50 50 50 92 50"></path><path class="sc-arrowhead" d="m86 46 6 4-6 4"></path></svg></div>
</div><figcaption class="sc-caption">The point is not to win an argument. It is to expose what has not yet been thought through.</figcaption>
</figure>
