<figure aria-labelledby="method-title" class="sc-figure socrates-restyled sc-method-figure" data-essay-diagram="socrates-method" id="method-figure">
  <h3 class="sc-figure-title" id="method-title">Examining the approval claim</h3>
  <div aria-label="A claim is questioned, pressure-tested against evidence, and revised into a better statement of the problem. The revised claim becomes the next starting point." class="sc-method-loop" role="group">
    <div class="sc-method-node sc-question" data-node>
      {{ partial "diagrams/atoms/node.html" (dict "label" "Initial claim" "detail" "This removes the agent’s ability to approve its own spending." "role" "input" "showRoleMarker" true) }}
    </div>
    <div aria-hidden="true" class="sc-cycle-connector sc-turn-one"><svg preserveAspectRatio="none" viewBox="0 0 100 100"><path d="M6 50 C50 50 50 50 50 92"></path><path class="sc-arrowhead" d="m46 86 4 6 4-6"></path></svg><span class="sc-vertical-arrow"></span></div>
    <div class="sc-method-node sc-examine" data-node>
      {{ partial "diagrams/atoms/node.html" (dict "label" "Question" "detail" "Which routes to the costly tools does this approval actually control?" "role" "caution" "showRoleMarker" true) }}
    </div>
    <div aria-hidden="true" class="sc-cycle-connector sc-turn-two"><svg preserveAspectRatio="none" viewBox="0 0 100 100"><path d="M50 6 C50 50 50 50 8 50"></path><path class="sc-arrowhead" d="m14 46-6 4 6 4"></path></svg><span class="sc-vertical-arrow"></span></div>
    <div class="sc-method-node sc-test" data-node>
      {{ partial "diagrams/atoms/node.html" (dict "label" "Tension" "detail" "The prompt guards one interface. The agent retains other access to the tools." "role" "mismatch" "showRoleMarker" true) }}
    </div>
    <div aria-hidden="true" class="sc-cycle-connector sc-turn-three"><svg preserveAspectRatio="none" viewBox="0 0 100 100"><path d="M94 50 C50 50 50 50 50 8"></path><path class="sc-arrowhead" d="m46 14 4-6 4 6"></path></svg><span class="sc-vertical-arrow"></span></div>
    <div class="sc-method-node sc-revise" data-node>
      {{ partial "diagrams/atoms/node.html" (dict "label" "Revised understanding" "detail" "Keep deliberate human approval in the guarded workflow. State the limit of that control." "role" "decision" "showRoleMarker" true) }}
    </div>
    <div aria-hidden="true" class="sc-cycle-connector sc-turn-four"><svg preserveAspectRatio="none" viewBox="0 0 100 100"><path d="M50 94 C50 50 50 50 92 50"></path><path class="sc-arrowhead" d="m86 46 6 4-6 4"></path></svg></div>
  </div>
  <figcaption class="sc-caption">Examining the claim established where the approval could be relied on.</figcaption>
</figure>
