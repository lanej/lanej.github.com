<figure aria-labelledby="method-title" class="sc-figure sc-method-figure" data-essay-diagram="socrates-method" id="method-figure">
<h3 class="sc-figure-title" id="method-title">One real Socratic turn</h3>
<div aria-label="A claim is questioned, pressure-tested against evidence, and revised into a better statement of the problem." class="sc-method-loop" role="group">
<div class="sc-cycle-node sc-question flow-node" data-node><span class="sc-node-label">Initial claim</span><span class="sc-node-detail">This removes the agent’s ability to approve its own spending.</span></div>
<div aria-hidden="true" class="sc-cycle-connector sc-turn-one"><svg preserveAspectRatio="none" viewBox="0 0 100 100"><path d="M6 50 C50 50 50 50 50 92"></path><path class="sc-arrowhead" d="m46 86 4 6 4-6"></path></svg><span class="sc-vertical-arrow"></span></div>
<div class="sc-cycle-node sc-examine flow-node" data-node><span class="sc-node-label">Question</span><span class="sc-node-detail">The same agent has shell access — what stops it from deleting the file that tracks spending?</span></div>
<div aria-hidden="true" class="sc-cycle-connector sc-turn-two"><svg preserveAspectRatio="none" viewBox="0 0 100 100"><path d="M50 6 C50 50 50 50 8 50"></path><path class="sc-arrowhead" d="m14 46-6 4 6 4"></path></svg><span class="sc-vertical-arrow"></span></div>
<div class="sc-cycle-node sc-test flow-node" data-node><span class="sc-node-label">Tension</span><span class="sc-node-detail">Nothing does. The check only stops one specific shortcut, not a determined agent.</span></div>
<div aria-hidden="true" class="sc-cycle-connector sc-turn-three"><svg preserveAspectRatio="none" viewBox="0 0 100 100"><path d="M94 50 C50 50 50 50 50 8"></path><path class="sc-arrowhead" d="m46 14 4-6 4 6"></path></svg><span class="sc-vertical-arrow"></span></div>
<div class="sc-cycle-node sc-revise flow-node" data-node><span class="sc-node-label">Revised understanding</span><span class="sc-node-detail">The property that survives examination is narrower: friction against an undocumented shortcut, not a containment boundary.</span></div>
<div aria-hidden="true" class="sc-cycle-connector sc-turn-four"><svg preserveAspectRatio="none" viewBox="0 0 100 100"><path d="M50 94 C50 50 50 50 92 50"></path><path class="sc-arrowhead" d="m86 46 6 4-6 4"></path></svg></div>
</div><figcaption class="sc-caption">The question changed the model of the problem before any fix was planned.</figcaption>
</figure>
