{{ define "main" }}<section class="page shell"><header class="page-header"><p class="eyebrow">Josh Lane</p><h1>{{ .Title }}</h1></header><div class="prose section-intro">{{ .Content }}</div>{{ if .Pages }}<div class="writing-list">{{ range .Pages.ByDate.Reverse }}<article class="writing-item"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2006" }}</time><h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>{{ with .Description }}<p>{{ . }}</p>{{ end }}</article>{{ end }}</div>{{ else }}<p class="empty-state">New writing will appear here.</p>{{ end }}</section>{{ end }}
