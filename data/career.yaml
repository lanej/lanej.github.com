- id: easypost
  anchor: easypost-technology-strategy
  company: EasyPost
  period: 2019–present
  logo: /logos/companies/easypost.svg
  roles:
    - title: Chief Technology Officer
      period: 2026–present
      description: |
        Define and execute company-wide technology strategy across platform, data, infrastructure, and post-sales operations, aligning investment to leverage, margin expansion, and long-term growth. Own end-to-end customer experience after the sale, including reliability, support, and operational systems.

        Transform EasyPost from a fragmented product portfolio into a unified, decision-driven platform with strong data integrity and reduced complexity. Establish decision systems (rate intelligence, policy-driven routing, financial-grade data pipelines) as core platform primitives.

        Reallocate capital and engineering investment toward high-leverage, high-margin capabilities; eliminate low-return complexity. Partner with the executive team on company direction, including monetization, enterprise readiness, and risk posture.
    - title: Vice President of Engineering
      period: 2025–2026
      description: |
        I led a 130+ engineer organization across Core API, Enterprise, Platform, and international subsidiaries.
    - title: Senior Director of Engineering
      period: 2024–2025
    - title: Director of Engineering
      period: 2023–2024
    - title: Senior Engineering Manager
      period: 2022–2023
    - title: Engineering Manager
      period: 2020–2022
    - title: Senior Software Engineer
      period: 2019–2020
      description: |
        I built warehouse logistics, inventory, order integrations, and fulfillment software.
  description: |
    Across engineering management and platform leadership, I was responsible for infrastructure, finance systems, shared services, and developer tooling. That included redesigning financial data pipelines to shorten revenue-recognition time, decomposing a monolithic application into services, and improving reliability and developer throughput.

    [EasyPost leadership biography](https://www.easypost.com/about/)
