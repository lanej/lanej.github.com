- project: jnv
  logo: /logos/projects/jnv-github.png
  date: '2025-02-28'
  summary: Added configuration-file support for custom keybindings and styles, using the XDG configuration-directory conventions.
  url: https://github.com/ynqa/jnv/pull/70
