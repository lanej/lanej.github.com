name: Refresh rendered website PR previews
on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
    branches: [master]
permissions:
  actions: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      # No PR checkout or execution in this privileged dispatcher. The existing
      # master publisher builds snapshots without credentials and verifies them.
      - name: Request a preview refresh on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$GH_REPO/actions/workflows/pages.yml/dispatches" \
            -f ref=master -F 'inputs[preview_refresh]=true'
