name: Verify published Work badges
on:
  push:
    branches: [verify/live-work-badges-51]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a38ed5b5c06b3113c3308d30b7a17ac05cd78b0e
          persist-credentials: false
      - name: Install verification tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r scripts/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          bash scripts/install-hugo.sh
      - name: Build merged source
        run: GITHUB_SHA=a38ed5b5c06b3113c3308d30b7a17ac05cd78b0e bash scripts/build.sh
      - name: Confirm deployed revision
        run: python3 scripts/live-smoke.py
      - name: Inspect the live Work page
        run: |
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          expected=json.loads(Path('public/build.json').read_text())['revision']
          out=Path('artifacts/live-work');out.mkdir(parents=True,exist_ok=True)
          checks=[]
          with sync_playwright() as p:
              browser=p.chromium.launch(executable_path=shutil.which('google-chrome'),args=['--no-sandbox'])
              for width in (320,390,768,1440):
                  page=browser.new_page(viewport={'width':width,'height':900},color_scheme='dark')
                  response=page.goto('https://lanej.io/record/',wait_until='networkidle')
                  assert response and response.ok
                  assert page.locator('meta[name="site-revision"]').get_attribute('content')==expected
                  page.locator('img').evaluate_all('(imgs)=>Promise.all(imgs.map(img=>img.decode()))')
                  assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                  assert page.locator('.company-logo img').count()==7
                  assert page.locator('.project-logo img').count()==5
                  assert page.locator('.event-logo img').count()==1
                  assert page.locator('.contribution-header h3').all_text_contents()==['hotreload.nvim','ogen','jnv','Sinatra','fog-aws']
                  assert page.locator('.speaking-header h3').inner_text()=='Sapporo RubyKaigi'
                  assert 'Reducing deployment friction' in page.locator('.speaking-detail').inner_text()
                  badges=page.locator('.work-logo').evaluate_all('(els)=>els.map(el=>{const r=el.getBoundingClientRect();return [r.width,r.height]})')
                  assert len(badges)==13 and all(abs(w-36)<1 and abs(h-36)<1 for w,h in badges)
                  for href in page.locator('.work-index a').evaluate_all('(links)=>links.map(a=>a.getAttribute("href"))'):
                      assert page.locator(href).count()==1,href
                  page.locator('.site-header').screenshot(path=str(out/f'header-{width}.png'))
                  if width in (390,1440):
                      page.screenshot(path=str(out/f'work-{width}.png'))
                      page.screenshot(path=str(out/f'work-full-{width}.png'),full_page=True)
                      page.locator('.contributions').screenshot(path=str(out/f'projects-{width}.png'))
                      page.locator('.speaking-engagement').screenshot(path=str(out/f'speaking-{width}.png'))
                  if width==320:
                      page.evaluate('document.documentElement.style.fontSize="200%"')
                      assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
                      assert page.locator('.site-header nav a').evaluate_all('(els)=>els.every(a=>a.scrollWidth<=a.clientWidth+1 && a.scrollHeight<=a.clientHeight+1)')
                      page.locator('.site-header').screenshot(path=str(out/'header-320-enlarged.png'))
                  checks.append({'width':width,'decoded_badges':13})
                  page.close()
              browser.close()
          (out/'report.json').write_text(json.dumps({'status':'passed','revision':expected,'checks':checks},indent=2))
          print(json.dumps({'status':'passed','revision':expected,'work_viewports':len(checks),'decoded_badges':13}))
          PY
      - name: Match served files and decode raster images
        run: |
          python3 - <<'PY'
          import concurrent.futures,hashlib,io,json,urllib.request,urllib.error
          from pathlib import Path
          from PIL import Image
          expected=json.loads(Path('public/build.json').read_text())
          def fetch(path):
              try:
                  with urllib.request.urlopen('https://lanej.io'+path,timeout=20) as r:return r.read()
              except urllib.error.HTTPError as e:
                  if path=='/404.html' and e.code==404:return e.read()
                  raise
          live=json.loads(fetch('/build.json'))
          assert live['revision']==expected['revision']
          assert live['files']==expected['files']
          def verify(item):
              path,digest=item;data=fetch(path)
              assert hashlib.sha256(data).hexdigest()==digest,path
              is_image=Path(path).suffix in ('.webp','.png','.jpg','.jpeg','.gif')
              if is_image:
                  with Image.open(io.BytesIO(data)) as im:im.load()
              return int(is_image)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:images=sum(pool.map(verify,expected['files'].items()))
          result={'status':'passed','revision':expected['revision'],'matching_live_files':len(expected['files']),'decoded_images':images}
          Path('artifacts/live-work/files.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-work-badges
          path: artifacts/live-work/
          retention-days: 14
