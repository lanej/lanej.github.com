name: Prepare verified source assets
on:
  push:
    branches: [site/remediate-foundation]
    paths: ['.bootstrap/**', '.github/workflows/prepare-assets.yml']
permissions:
  contents: write
  pages: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assemble and verify full-resolution supplied photograph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p prepared
          cat .bootstrap/part-0 .bootstrap/part-1 .bootstrap/part-2 .bootstrap/part-3 > prepared/josh-lane.webp
          echo 'e1505b9e7535ac59efc634f4259fd37d581afaef1e187eae51442899c0313e47  prepared/josh-lane.webp' | sha256sum --check
          python3 - <<'PY'
          import base64, json, pathlib
          data=pathlib.Path('prepared/josh-lane.webp').read_bytes()
          pathlib.Path('/tmp/blob.json').write_text(json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}))
          PY
          gh api --method POST repos/lanej/lanej.github.com/git/blobs --input /tmp/blob.json | tee prepared/blob.json
          test "$(python3 -c "import json; print(json.load(open('prepared/blob.json'))['sha'])")" = 89641b086d48a8f45b60184c17e02f1021a661ce
      - name: Fetch pinned Hugo for local verification
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v0.165.0/hugo_0.165.0_linux-amd64.tar.gz
          echo '5c3a37a5450b3e386e5b75a87a790fea2d04a796d75e171216c80ef48a32b432  /tmp/hugo.tar.gz' | sha256sum --check
          tar -xzf /tmp/hugo.tar.gz -C prepared hugo
          prepared/hugo version
      - name: Inspect existing Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/lanej/lanej.github.com/pages | tee prepared/pages.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-source-and-hugo
          path: prepared/
          retention-days: 2
          if-no-files-found: error
