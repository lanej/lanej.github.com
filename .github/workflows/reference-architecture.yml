name: Verify reference architecture
on:
  pull_request:
    paths:
      - 'examples/review-publication/**'
      - '.github/workflows/reference-architecture.yml'
  push:
    branches: [master]
    paths:
      - 'examples/review-publication/**'
      - '.github/workflows/reference-architecture.yml'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/review-publication
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: examples/review-publication/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run demo
