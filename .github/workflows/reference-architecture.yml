name: Verify reference architecture
on:
  pull_request:
    paths:
      - 'examples/plan-review/**'
      - '.github/workflows/reference-architecture.yml'
  push:
    branches: [master]
    paths:
      - 'examples/plan-review/**'
      - '.github/workflows/reference-architecture.yml'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: examples/plan-review
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo run --locked
